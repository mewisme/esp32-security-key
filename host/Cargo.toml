[workspace]
resolver = "2"
members = ["multikey-proto", "multikey-fido", "multikey-host", "multikey-cli", "multikey-pam"]
# multikey-pam links libpam on Linux only; keep it out of plain `cargo test`/`build`.
default-members = ["multikey-proto", "multikey-fido", "multikey-host", "multikey-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mewisme/esp32-security-key"

[workspace.dependencies]
multikey-proto = { path = "multikey-proto" }
multikey-host = { path = "multikey-host" }
multikey-fido = { path = "multikey-fido" }
