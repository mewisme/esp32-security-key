[package]
name = "multikey-host"
description = "Host library for the MKAUTH v1 applet over PC/SC, plus the trust store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Device inventory (FIDO HID + PC/SC pairing). Off by default so the PAM module does not link HID code.
inventory = ["dep:multikey-fido"]

[dependencies]
multikey-proto.workspace = true
multikey-fido = { workspace = true, optional = true }
pcsc = "2"
getrandom = "0.2"
subtle = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
hex = "0.4"
thiserror = "1"

[dev-dependencies]
multikey-proto = { path = "../multikey-proto", features = ["test-key"] }
tempfile = "3"
