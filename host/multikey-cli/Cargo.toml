[package]
name = "multikey-cli"
description = "multikey command line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "multikey"
path = "src/main.rs"

[dependencies]
multikey-proto.workspace = true
multikey-host = { workspace = true, features = ["inventory"] }
multikey-fido.workspace = true
clap = { version = "4", features = ["derive"] }
rpassword = "7"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nusb = "0.2"
zeroize = "1"
