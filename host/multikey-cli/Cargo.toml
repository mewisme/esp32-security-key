[package]
name = "multikey-cli"
description = "multikey command line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "multikey"
path = "src/main.rs"

[dependencies]
multikey-proto.workspace = true
multikey-host.workspace = true
clap = { version = "4", features = ["derive"] }
