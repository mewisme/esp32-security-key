<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#14263f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="260" fill="#38bdf8" opacity="0.06"/>
  <rect x="0" y="0" width="12" height="640" fill="url(#accent)"/>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="28" font-weight="600" fill="#38bdf8" letter-spacing="3">OPEN-SOURCE SECURITY KEY</text>
    <text x="76" y="270" font-size="132" font-weight="800" fill="#ffffff" letter-spacing="-3">MultiKeys</text>
    <text x="80" y="340" font-size="34" fill="#cbd5e1">FIDO2 / passkeys on an ESP32-S3 board.</text>
    <text x="80" y="388" font-size="34" fill="#cbd5e1">Touch BOOT to sign in.</text>

    <g font-size="24" font-weight="600" fill="#e2e8f0">
      <rect x="80" y="452" width="238" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="108" y="484">Browser installer</text>
      <rect x="334" y="452" width="170" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="362" y="484">multikey CLI</text>
      <rect x="520" y="452" width="170" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="548" y="484">Linux PAM</text>
    </g>
    <text x="80" y="570" font-size="30" font-weight="600" fill="url(#accent)">multikeys.mewis.me</text>
  </g>

  <!-- board -->
  <g transform="translate(850 170)">
    <rect x="0" y="40" width="380" height="250" rx="22" fill="url(#pcb)" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="3"/>
    <!-- USB connector -->
    <rect x="-46" y="115" width="70" height="100" rx="8" fill="#94a3b8"/>
    <rect x="-36" y="127" width="52" height="76" rx="4" fill="#0f172a"/>
    <rect x="-30" y="150" width="40" height="12" fill="#475569"/>
    <!-- chip -->
    <rect x="130" y="95" width="130" height="130" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
    <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <path d="M150 85v10M175 85v10M200 85v10M225 85v10M250 85v10"/>
      <path d="M150 225v10M175 225v10M200 225v10M225 225v10M250 225v10"/>
      <path d="M120 115h10M120 140h10M120 165h10M120 190h10M120 215h10"/>
      <path d="M260 115h10M260 140h10M260 165h10M260 190h10M260 215h10"/>
    </g>
    <text x="195" y="168" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#cbd5e1">ESP32-S3</text>
    <!-- BOOT button -->
    <circle cx="320" cy="240" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="320" cy="240" r="14" fill="url(#accent)"/>
    <text x="320" y="288" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#38bdf8">BOOT</text>
    <!-- traces -->
    <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="3" fill="none">
      <path d="M24 140h96M24 190h96M260 150h40v60"/>
    </g>
  </g>
</svg>
