name: web

# Web installer (web/): typecheck, lint, unit and e2e tests on every change.
# Deployment exists ONLY as manual `workflow_dispatch` runs: no push, pull_request, tag or other workflow can reach
# a deploy job. Staging and production are separate jobs bound to separate GitHub Environments (`staging`,
# `production`); production additionally needs main as the ref and a typed confirmation. Environment reviewers,
# branch rules and the Cloudflare token scope are settings, not code: docs/DEPLOYMENT.md.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/flash_policy.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'tools/flash_policy.json'
      - '.github/workflows/web.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after the checks pass
        type: choice
        options: [none, staging, production]
        default: none
      confirm_production:
        description: 'Production only: type "deploy-production" to confirm'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # A manual run may be deploying: never cancel it because another run started on the same ref.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # `pnpm build` runs `tsc -b` first, so a separate typecheck step would compile everything twice.
      - run: pnpm build
      - name: Production bundle contains no test doubles
        run: '! grep -rlE "multikeys-e2e-scenario|FakeDriver|FakeKeyConnector" dist/client'
      # No browser cache: a hit saved no reliable time (docs/CI_PERFORMANCE.md), and it needed two install paths.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  deploy-staging:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'staging'
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
    concurrency:
      group: web-deploy-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:staging

  deploy-production:
    needs: check
    # Only an explicit manual run of main with the typed confirmation. The `production` environment must also have
    # required reviewers and a main-only deployment branch rule (docs/DEPLOYMENT.md); neither is enforceable here.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.deploy == 'production'
      && inputs.confirm_production == 'deploy-production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    concurrency:
      group: web-deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
