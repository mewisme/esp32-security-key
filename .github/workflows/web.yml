name: web

# Web installer (web/): typecheck, lint, unit and e2e tests on every change. Deploys only from a manual run with
# `deploy: staging|production`; the Cloudflare secrets live in the `cloudflare-<target>` environments (production should have
# a required reviewer).
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/flash_policy.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'tools/flash_policy.json'
      - '.github/workflows/web.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after the checks pass
        type: choice
        options: [none, staging, production]
        default: none

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Production bundle contains no test doubles
        run: '! grep -rlE "multikeys-e2e-scenario|FakeDriver" dist/client'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.deploy != 'none'
    runs-on: ubuntu-24.04
    environment: cloudflare-${{ inputs.deploy }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.deploy }}
        run: |
          if [ "$TARGET" = staging ]; then pnpm run deploy:staging; else pnpm run deploy; fi
